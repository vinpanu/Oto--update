<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OTO Weekly Update</title>
<style>
:root { color-scheme: light dark; --fg: #1f1e1c; --muted: #6b6963; --bg: #f7f5f1; --panel: #ffffff; --line: #e4e0d8; --accent: #2f6fdb; --bad: #c2412d; }
@media (prefers-color-scheme: dark) { :root { --fg: #edebe6; --muted: #a6a39c; --bg: #1a1916; --panel: #23221f; --line: #3a3833; --accent: #6f9bf0; --bad: #ef7a64; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 24px; background: radial-gradient(60% 50% at 15% 10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), var(--bg); }
form { width: min(100%, 380px); display: grid; gap: 14px; padding: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, .08); }
h1 { margin: 0; font: 400 1.9rem/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.45; }
label { display: grid; gap: 6px; font-size: .85rem; font-weight: 500; }
input[type=password] { font: inherit; font-size: 1rem; padding: 10px 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 400; color: var(--muted); }
button { font: inherit; font-weight: 600; padding: 11px 14px; color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
.error { min-height: 1.2em; color: var(--bad); font-size: .85rem; }
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <h1>OTO Weekly Update</h1>
  <p>This update is private. Enter the password to open it.</p>
  <label>Password<input id="pw" type="password" autocomplete="current-password" required autofocus></label>
  <label class="check"><input id="remember" type="checkbox"> Remember on this device</label>
  <button id="open" type="submit">Open the update</button>
  <p class="error" id="error" role="alert"></p>
</form>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const store = 'oto-key-' + P.salt;
const show = async (raw, remember) => {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, key, b64(P.data));
  const html = new TextDecoder().decode(plain);
  if (remember) {
    try { localStorage.setItem(store, btoa(String.fromCharCode(...raw))); } catch (e) {}
  }
  document.open();
  document.write(html);
  document.close();
};
const derive = async (pw) => {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter}, base, 256));
};
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(store); } catch (e) {}
  if (saved) {
    try { await show(b64(saved), false); return; } catch (e) { try { localStorage.removeItem(store); } catch (e2) {} }
  }
})();
document.getElementById('gate').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('open');
  const err = document.getElementById('error');
  btn.disabled = true;
  err.textContent = '';
  const remember = document.getElementById('remember').checked;
  try {
    const raw = await derive(document.getElementById('pw').value);
    await show(raw, remember);
  } catch (e) {
    err.textContent = 'That password didn\u2019t work. Try again.';
    btn.disabled = false;
  }
});
</script>
